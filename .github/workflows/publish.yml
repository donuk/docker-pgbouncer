name: Publish Docker image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  docker:
    uses: donuk/github-build-to-dockerhub/.github/workflows/docker-publish.yml@master
    with:
      image_name: donuk/pgbouncer
      test_script: |
        sh -n /entrypoint-wrapper.sh
        sh -n /fixconfig-and-run.sh
        /usr/bin/pgbouncer --version
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
